openapi: 3.1.0
info:
  title: Assistente de Calendários DENTEC PROENS
  version: 0.1.0
  description: Contrato inicial proposto. Endpoints ainda não implementados; não é um serviço publicado.
security:
  - institutionalSession: []
paths:
  /calendars:
    post:
      summary: Criar rascunho para campus e oferta autorizados
      operationId: createCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [campusId, offerId, year, mode, rulePackId]
              properties:
                campusId: {type: string, format: uuid}
                offerId: {type: string, format: uuid}
                year: {type: integer, minimum: 1900, maximum: 9999}
                mode: {type: string, enum: [BUILD, REVIEW, CHECK, PREPARE_SUBMISSION]}
                rulePackId: {type: string, format: uuid}
      responses:
        '201':
          description: Rascunho criado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        '401': {description: Não autenticado}
        '403': {description: Campus não autorizado}
        '422': {description: Dados ou pacote incompatíveis}
  /calendars/{calendarId}:
    parameters:
      - name: calendarId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Consultar calendário no escopo autorizado
      operationId: getCalendar
      responses:
        '200':
          description: Calendário
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        '401': {description: Não autenticado}
        '404': {description: Não encontrado ou fora do escopo}
  /calendars/{calendarId}/validations:
    parameters:
      - name: calendarId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Validar versão imutável usando dados resolvidos no servidor
      operationId: validateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId]
              properties:
                versionId: {type: string, format: uuid}
      responses:
        '201':
          description: Conferência preliminar persistida
          content:
            application/json:
              schema:
                type: object
                required: [id, versionId, inputHash, status, findings, officialApproval]
                properties:
                  id: {type: string, format: uuid}
                  versionId: {type: string, format: uuid}
                  inputHash: {type: string}
                  status: {type: string, enum: [INCOMPLETE, ISSUES, READY_FOR_SUBMISSION]}
                  officialApproval: {type: boolean, const: false}
                  findings:
                    type: array
                    items:
                      type: object
                      required: [ruleId, result, severity, evidenceIds]
                      properties:
                        ruleId: {type: string}
                        result: {type: string, enum: [MET, NOT_MET, NOT_VERIFIABLE, HUMAN_REVIEW, NOT_APPLICABLE]}
                        severity: {type: string, enum: [BLOCK, WARNING, INFO]}
                        evidenceIds: {type: array, items: {type: string, format: uuid}}
        '401': {description: Não autenticado}
        '404': {description: Calendário ou versão inexistente ou fora do escopo}
        '409': {description: Versão não é a versão corrente}
components:
  securitySchemes:
    institutionalSession:
      type: apiKey
      in: cookie
      name: dentec_session
      description: Sessão Secure HttpOnly após login institucional. Mutações exigem proteção CSRF no backend.
  schemas:
    Calendar:
      type: object
      required: [id, campusId, offerId, year, state, versionId]
      properties:
        id: {type: string, format: uuid}
        campusId: {type: string, format: uuid}
        offerId: {type: string, format: uuid}
        year: {type: integer}
        state: {type: string, enum: [DRAFT, IN_REVIEW, HAS_ISSUES, READY_FOR_SUBMISSION]}
        versionId: {type: string, format: uuid}
