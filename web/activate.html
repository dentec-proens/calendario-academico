<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Criar minha senha · DENTEC/PROENS</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portal.css"></head><body><main><section class="panel auth"><h1>Criar minha senha</h1><p id="invite-info">Verificando convite…</p><p id="invite-message" role="status"></p><form id="activation-form" hidden><label>Confirme seu e-mail institucional<input id="activation-email" type="email" autocomplete="username" required></label><label>Crie uma senha para este sistema<input id="activation-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Repita a senha<input id="activation-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="help">Use pelo menos 12 caracteres. Esta é a senha do assistente de calendários; não precisa ser a senha do seu e-mail.</p><button id="activate-button">Criar senha e ativar conta</button></form><a href="/">Voltar ao login</a></section></main><script type="module" src="/activate.js"></script></body></html>
