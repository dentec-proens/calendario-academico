name: Qualidade e testes Convex
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_CONVEX_URL: https://synthetic-ci.convex.cloud
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:types
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
  browser:
    runs-on: ubuntu-24.04
    # Match the browser, system libraries and fonts used for the Linux baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:runtime
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  windows:
    runs-on: windows-latest
    env:
      VITE_CONVEX_URL: https://synthetic-ci.convex.cloud
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
  # Preserve the check gate: every supported environment must pass.
  check:
    if: ${{ always() }}
    needs: [quality, browser, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar qualidade e testes de navegador
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success && test "$WINDOWS_RESULT" = success
